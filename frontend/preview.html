    const KNOWLEDGE_RESPONSES = {
      pcos_en: "PCOS (Polycystic Ovary Syndrome) is a hormonal condition where ovaries may not release an egg regularly. This can cause irregular menstrual cycles, acne, excess hair, or weight changes. It is manageable through consistent balanced nutrition, regular movement, and clinician care.",

    function App() {

      const [chatMessages, setChatMessages] = useState([
        { id: 1, sender: 'assistant', text: isTe ? 'నమస్తే ప్రియ! నేను మీ పిసిఒఎస్ సాథిని. ఆహారం, సైకిల్స్, లేదా రిపోర్టుల గురించి ఏదైనా అడగండి.' : 'Hello Priya! I am your PCOS Saathi companion. Ask me any health-education questions about cycles, Indian meals, or doctor visit preparation.', sources: ['WHO Guidelines', 'FOGSI Consensus'] }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [isListening, setIsListening] = useState(false);
      const [playingAudioId, setPlayingAudioId] = useState(null);
      const [isSpeaking, setIsSpeaking] = useState(false);

      // Modals
      const [activeModal, setActiveModal] = useState(null); // 'log_cycle', 'add_reminder', 'meal_detail', 'report_detail', 'report_post'
      const [selectedMealDetail, setSelectedMealDetail] = useState(null);
      const [selectedReportDetail, setSelectedReportDetail] = useState(null);

      // Filters
      const [mealCategoryFilter, setMealCategoryFilter] = useState('all');
      const [mealDietFilter, setMealDietFilter] = useState('all');
      const [budgetOnly, setBudgetOnly] = useState(false);

      // Sync to localStorage
      useEffect(() => { localStorage.setItem('pcos_profile', JSON.stringify(profile)); }, [profile]);
      useEffect(() => { localStorage.setItem('pcos_cycles', JSON.stringify(cycleLogs)); }, [cycleLogs]);
      useEffect(() => { localStorage.setItem('pcos_reports', JSON.stringify(reports)); }, [reports]);
      useEffect(() => { localStorage.setItem('pcos_reminders', JSON.stringify(reminders)); }, [reminders]);
      useEffect(() => { localStorage.setItem('pcos_meal_plan', JSON.stringify(dailyPlan)); }, [dailyPlan]);

      // Global stop all audio and release media streams
      const stopAudio = () => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        document.querySelectorAll('audio, video').forEach(el => {
          try {
            el.pause();
            el.currentTime = 0;
          } catch (e) {}
        });
        setPlayingAudioId(null);
        setIsSpeaking(false);
      };

      // Automatically stop voice playback if user switches tabs
      useEffect(() => {
        stopAudio();
      }, [currentTab]);

      // Automatically stop voice playback if user leaves or refreshes
      useEffect(() => {
        const handleUnload = () => {
          stopAudio();
        };
        window.addEventListener('beforeunload', handleUnload);
        return () => {
          window.removeEventListener('beforeunload', handleUnload);
          stopAudio();

          let reply = isTe ? KNOWLEDGE_RESPONSES.pcos_te : KNOWLEDGE_RESPONSES.pcos_en;

          const qLower = query.toLowerCase();

          if (qLower.includes('diet') || qLower.includes('food') || qLower.includes('tinali') || qLower.includes('aaharam')) {
            reply = isTe ? KNOWLEDGE_RESPONSES.diet_te : KNOWLEDGE_RESPONSES.diet_en;
            sources = ['ICMR Nutrition'];
          } else if (qLower.includes('doctor') || qLower.includes('questions') || qLower.includes('adagali')) {
            reply = isTe ? KNOWLEDGE_RESPONSES.doctor_te : KNOWLEDGE_RESPONSES.doctor_en;
            sources = ['ACOG Guidelines'];

            reply = isTe

              : '⚠️ URGENT MEDICAL ADVISORY: Severe pelvic pain or excessive bleeding requires immediate in-person emergency clinical attention. Please consult an emergency room right away.';
            sources = ['Emergency Medical Protocol'];
          }

          const botMsg = { id: Date.now() + 1, sender: 'assistant', text: reply, sources };
          setChatMessages(prev => [...prev, botMsg]);

          return;
        }
        const rec = new SpeechRec();
        rec.lang = isTe ? 'te-IN' : 'en-IN';
        rec.onstart = () => setIsListening(true);

          stopAudio();
          return;

        // Halt any existing speech or media first
        stopAudio();

        // Strip non-spoken characters, asterisks, urls, and emojis so voice reads smoothly
        const cleanText = text

          .replace(/https?:\/\/\S+/g, '')
          .replace(/[\u{1F300}-\u{1FAFF}]/gu, '')
          .trim();

        if (!cleanText) return;

        const utt = new SpeechSynthesisUtterance(cleanText);
        utt.lang = isTe ? 'te-IN' : 'en-IN';
        utt.rate = 0.95;

        const voices = window.speechSynthesis.getVoices();
        const targetPrefix = isTe ? 'te' : 'en';
        const match = voices.find(v => v.lang.toLowerCase().startsWith(targetPrefix));

          setPlayingAudioId(msgId);
          setIsSpeaking(true);

        utt.onend = () => {
          setPlayingAudioId(null);
          setIsSpeaking(false);
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }

          setIsSpeaking(false);
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }
        };

        const keepAlive = setInterval(() => {
          if (!window.speechSynthesis.speaking) {
            clearInterval(keepAlive);
          } else {
            window.speechSynthesis.pause();
            window.speechSynthesis.resume();
          }
        }, 10000);

        utt.addEventListener('error', () => clearInterval(keepAlive));

          )}

          {/* LOG CYCLE MODAL */}
          {activeModal === 'log_cycle' && (
            <div className="modal-overlay" onClick={() => setActiveModal(null)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <h3>🌸 Log Period Event</h3>
                  <button onClick={() => setActiveModal(null)}>✕</button>
                </div>
                <div className="modal-body">
                  <div className="form-group">
                    <label className="form-label">Period Start Date</label>
                    <input type="date" defaultValue="2026-10-09" id="log-start" />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Duration (Days)</label>
                    <input type="number" defaultValue="4" id="log-duration" />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Flow Intensity</label>
                    <select id="log-flow">
                      <option value="medium">Medium</option>
                      <option value="light">Light</option>
                      <option value="heavy">Heavy</option>
                      <option value="spotting">Spotting</option>
                    </select>
                  </div>
                  <button onClick={() => {
                    const startDate = document.getElementById('log-start').value;
                    const durationDays = document.getElementById('log-duration').value;
                    const flow = document.getElementById('log-flow').value;
                    setCycleLogs([{ id: Date.now(), startDate, durationDays, flow, symptoms: ['cramps'], notes: 'Logged in app' }, ...cycleLogs]);
                    setActiveModal(null);
                  }} className="btn btn-coral" style={{ width: '100%', marginTop: '10px' }}>Save Cycle Log</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
